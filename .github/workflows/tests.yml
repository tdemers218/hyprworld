name: tests

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
      - name: Run tests
        run: make check
